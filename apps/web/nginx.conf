server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Socket.IO（WebSocket + polling 降级）同源反代到 api 容器。
    # 注意不能写 /socket.io/：engine.io 的请求形如 /socket.io?EIO=4&...（无尾斜杠），
    # 带斜杠的前缀匹配不到，请求会落入 SPA fallback 返回 HTML。
    location /socket.io {
        proxy_pass http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：WebSocket 会话可能保持数天
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 健康检查直通后端
    location = /health {
        proxy_pass http://api:3002/health;
    }

    # 前端为 SPA，未知路径回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
